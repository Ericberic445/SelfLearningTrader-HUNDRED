name: Build SelfLearningTrader HUNDRED

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'SelfLearningTrader_HUNDRED_*.zip' \
              -not -path "$GITHUB_WORKSPACE/.git/*" \
              -print |
            sort -V |
            tail -n 1
          )"

          test -n "$ZIP"

          echo "Selected ZIP:"
          echo "$ZIP"

          unzip -q -t "$ZIP"

          INSTALL_ROOT="/tmp/hundred_project"

          rm -rf "$INSTALL_ROOT"
          mkdir -p "$INSTALL_ROOT"

          unzip -q -o "$ZIP" -d "$INSTALL_ROOT"

          ROOT="$INSTALL_ROOT"

          mapfile -t TOP < <(
            find "$INSTALL_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          echo "Project root:"
          echo "$ROOT"

          test -f "$ROOT/buildozer.spec"
          test -f "$ROOT/requirements.txt"
          test -f "$ROOT/app/main.py"
          test -f "$ROOT/signing/debug.keystore
