name: Install and Build FIVE

on:
  workflow_dispatch:
  push:
    paths:
      - "SelfLearningTrader_FIVE_*.zip"
      - "**/SelfLearningTrader_FIVE_*.zip"

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select and extract FIVE ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" -type f \
              -name 'SelfLearningTrader_FIVE_*.zip' \
              -not -path "$GITHUB_WORKSPACE/.git/*" \
              -print | sort -V
          )

          test "${#ZIPS[@]}" -gt 0

          ZIP="${ZIPS[${#ZIPS[@]}-1]}"

          echo "Selected ZIP: $ZIP"

          sha256sum "$ZIP"
          unzip -q -t "$ZIP"

          INSTALL_ROOT="/tmp/five_project"

          rm -rf "$INSTALL_ROOT"
          mkdir -p "$INSTALL_ROOT"

          unzip -q -o "$ZIP" -d "$INSTALL_ROOT"

          ROOT="$INSTALL_ROOT"

          mapfile -t TOP < <(
            find "$INSTALL_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          echo "Project root: $ROOT"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$ROOT"/ "$GITHUB_WORKSPACE"/

          rm -rf "$INSTALL_ROOT"

          cd "$GITHUB_WORKSPACE"

          test -f buildozer.spec
          test -f requirements.txt
          test -f app/main.py
          test -f signing/debug.keystore

          echo "=== PROJECT VERSION FROM ZIP ==="

          grep -E \
            '^[[:space:]]*(package.name|package.domain|version|android.numeric_version)[[:space:]]*=' \
            buildozer.spec

      - name: Read project identity and version
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          PACKAGE_DOMAIN="$(
            sed -n \
              's/^[[:space:]]*package.domain[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
              tail -n 1 |
              xargs
          )"

          PACKAGE_NAME="$(
            sed -n \
              's/^[[:space:]]*package.name[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
              tail -n 1 |
              xargs
          )"

          VERSION="$(
            sed -n \
              's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
              tail -n 1 |
              xargs
          )"

          NUMERIC_VERSION="$(
            sed -n \
              's/^[[:space:]]*android.numeric_version[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
              tail -n 1 |
              xargs
          )"

          test -n "$PACKAGE_DOMAIN"
          test -n "$PACKAGE_NAME"
          test -n "$VERSION"
          test -n "$NUMERIC_VERSION"

          PACKAGE_ID="${PACKAGE_DOMAIN}.${PACKAGE_NAME}"

          echo "Package domain: $PACKAGE_DOMAIN"
          echo "Package name:   $PACKAGE_NAME"
          echo "Package ID:     $PACKAGE_ID"
          echo "Version:        $VERSION"
          echo "Version code:   $NUMERIC_VERSION"

          test "$PACKAGE_ID" = "org.selflearningtrader.selflearningtrader"

          echo "FIVE_PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"
          echo "FIVE_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "FIVE_VERSION_CODE=$NUMERIC_VERSION" >> "$GITHUB_ENV"

          python3 -m compileall -q app

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ant autoconf automake autopoint ccache cmake \
            g++ gcc gettext git lbzip2 \
            libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev \
            libssl-dev libtool make openjdk-17-jdk patch pkg-config \
            python3 python3-dev python3-pip python3-venv rsync \
            unzip wget zip zlib1g-dev

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            "cython==3.0.12" \
            "buildozer==1.5.0"

      - name: Verify fixed signing key
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          test -f signing/debug.keystore

          mkdir -p "$HOME/.android"

          cp signing/debug.keystore \
            "$HOME/.android/debug.keystore"

          chmod 600 \
            "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          keytool -list -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            > keytool-cert.txt

          KEY_SHA="$(
            awk -F': ' \
              '/SHA256:/{print $2; exit}' \
              keytool-cert.txt
          )"

          test -n "$KEY_SHA"

          KEY_SHA="$(
            echo "$KEY_SHA" |
            tr -d '[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )"

          test "$KEY_SHA" = \
            "13:E0:41:41:39:05:CE:30:B0:AA:3E:40:5A:F9:7D:DE:86:2B:0C:3C:FE:DD:DB:8B:66:52:FA:28:D6:68:7F:04"

          echo "=== FIXED KEY CERTIFICATE ==="

          grep -E \
            'Owner:|SHA256:' \
            keytool-cert.txt

          echo "Fixed signing key verification passed."

      - name: Clean Android build state
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf .buildozer bin signed

          find . \
            -type d \
            -name '__pycache__' \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            -name '*.pyc' \
            -delete

          find . \
            -type f \
            -name '*.pyo' \
            -delete

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"

          test -x "$JAVA_HOME/bin/java"
          test -x "$JAVA_HOME/bin/javac"

          java -version
          javac -version

          buildozer -v android debug \
            2>&1 | tee build.log

      - name: Locate Android signing tools
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$HOME/.buildozer" \
              -type f \
              -name apksigner \
              -perm -111 \
              -print 2>/dev/null |
              sort -V |
              tail -n 1
          )"

          ZIPALIGN="$(
            find "$HOME/.buildozer" \
              -type f \
              -name zipalign \
              -perm -111 \
              -print 2>/dev/null |
              sort -V |
              tail -n 1
          )"

          AAPT="$(
            find "$HOME/.buildozer" \
              -type f \
              -name aapt \
              -perm -111 \
              -print 2>/dev/null |
              sort -V |
              tail -n 1
          )"

          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          test -n "$AAPT"

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

          "$APKSIGNER" version
          test -x "$ZIPALIGN"
          "$AAPT" version

      - name: Verify build APK package and version
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          APK="$(
            find bin \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          test -n "$APK"

          echo "Build APK: $APK"

          BADGING="$(
            "$AAPT" dump badging "$APK"
          )"

          printf '%s\n' "$BADGING" |
            sed -n '1,5p'

          printf '%s\n' "$BADGING" |
            grep -q \
            "package: name='${FIVE_PACKAGE_ID}'"

          printf '%s\n' "$BADGING" |
            grep -q \
            "versionCode='${FIVE_VERSION_CODE}'"

          printf '%s\n' "$BADGING" |
            grep -q \
            "versionName='${FIVE_VERSION}'"

      - name: Align and sign APK with fixed FIVE key
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          APK="$(
            find bin \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          test -n "$APK"

          rm -rf signed
          mkdir -p signed

          "$ZIPALIGN" \
            -f \
            -p 4 \
            "$APK" \
            signed/aligned.apk

          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out signed/final.apk \
            signed/aligned.apk

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            signed/final.apk

          rm -f bin/*.apk

          cp signed/final.apk bin/

      - name: Verify final APK identity, alignment and certificate
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          APK="$(
            find bin \
              -type f \
              -name '*.apk' \
              -print -quit
          )"

          test -n "$APK"

          FAIL=0

          echo "=== FINAL APK ==="
          ls -lh "$APK"

          echo "=== APK SIGNATURE VERIFICATION ==="

          if "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" > apk-cert.txt 2>&1; then

            cat apk-cert.txt

          else

            echo "::error::APKSIGNER_VERIFY_FAILED"
            cat apk-cert.txt
            FAIL=1

          fi

          echo "=== CHECK V1 ==="

          V1_LINE="$(
            grep -F \
              "Verified using v1 scheme (JAR signing):" \
              apk-cert.txt |
              head -n 1 || true
          )"

          echo "Actual V1 result: ${V1_LINE:-NOT FOUND}"

          if printf '%s\n' "$V1_LINE" |
            grep -Fq ": true"; then

            echo "OK: v1 signing = true"

          else

            echo "::warning::V1_SIGNING_CHECK_FAILED"
            echo "V1 is not verified."
            echo "Actual line: ${V1_LINE:-NOT FOUND}"
            echo "V2 and V3 are checked independently below."

          fi

          echo "=== CHECK V2 ==="

          V2_LINE="$(
            grep -F \
              "Verified using v2 scheme (APK Signature Scheme v2):" \
              apk-cert.txt |
              head -n 1 || true
          )"

          echo "Actual V2 result: ${V2_LINE:-NOT FOUND}"

          if printf '%s\n' "$V2_LINE" |
            grep -Fq ": true"; then

            echo "OK: v2 signing = true"

          else

            echo "::error::V2_SIGNING_CHECK_FAILED"
            echo "Expected V2 verification to be true."
            echo "Actual line: ${V2_LINE:-NOT FOUND}"
            FAIL=1

          fi

          echo "=== CHECK V3 ==="

          V3_LINE="$(
            grep -F \
              "Verified using v3 scheme (APK Signature Scheme v3):" \
              apk-cert.txt |
              head -n 1 || true
          )"

          echo "Actual V3 result: ${V3_LINE:-NOT FOUND}"

          if printf '%s\n' "$V3_LINE" |
            grep -Fq ": true"; then

            echo "OK: v3 signing = true"

          else

            echo "::error::V3_SIGNING_CHECK_FAILED"
            echo "Expected V3 verification to be true."
            echo "Actual line: ${V3_LINE:-NOT FOUND}"
            FAIL=1

          fi

          echo "=== CHECK SIGNING KEY SHA-256 ==="

          KEY_SHA="$(
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey |
              awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          if [ -z "$KEY_SHA" ]; then

            echo "::error::KEY_SHA_EXTRACTION_FAILED"
            echo "Could not extract SHA-256 from debug.keystore."
            FAIL=1

          else

            KEY_SHA="$(
              echo "$KEY_SHA" |
              tr -d '[:space:]:' |
              tr '[:lower:]' '[:upper:]'
            )"

            echo "Expected signing certificate SHA-256:"
            echo "$KEY_SHA"

          fi

          echo "=== CHECK APK CERTIFICATE SHA-256 ==="

          APK_SHA_FILE="$(mktemp)"

          awk '
            /certificate SHA-256 digest:/ {
              capture=1
              sub(/^.*certificate SHA-256 digest:[[:space:]]*/, "")
              gsub(/[[:space:]]/, "")
              value=value $0
              next
            }

            capture && /certificate SHA-1 digest:/ {
              print value
              exit
            }

            capture {
              gsub(/[[:space:]]/, "")
              value=value $0
            }
          ' apk-cert.txt > "$APK_SHA_FILE"

          APK_SHA="$(cat "$APK_SHA_FILE")"

          rm -f "$APK_SHA_FILE"

          if [ -z "$APK_SHA" ]; then

            echo "::error::APK_CERTIFICATE_SHA256_EXTRACTION_FAILED"
            echo "Could not extract certificate SHA-256 from apksigner output."
            echo "=== RAW CERTIFICATE SHA-256 SECTION ==="
            grep -A 8 -B 2 \
              "certificate SHA-256 digest:" \
              apk-cert.txt || true
            FAIL=1

          else

            APK_SHA="$(
              echo "$APK_SHA" |
              tr -d '[:space:]:' |
              tr '[:lower:]' '[:upper:]'
            )"

            echo "Actual APK certificate SHA-256:"
            echo "$APK_SHA"

          fi

          if [ -n "${KEY_SHA:-}" ] &&
             [ -n "${APK_SHA:-}" ]; then

            echo "=== COMPARE CERTIFICATE SHA-256 ==="

            if [ "$KEY_SHA" = "$APK_SHA" ]; then

              echo "OK: certificate SHA-256 matches fixed signing key."

            else

              echo "::error::CERTIFICATE_SHA256_MISMATCH"
              echo "Expected: $KEY_SHA"
              echo "Actual:   $APK_SHA"
              FAIL=1

            fi

          fi

          echo "=== CHECK APK ALIGNMENT ==="

          if "$ZIPALIGN" \
            -c \
            -P 4 \
            -v 4 \
            "$APK"; then

            echo "OK: APK alignment check passed."

          else

            echo "::error::ZIPALIGN_CHECK_FAILED"
            echo "The final APK is not correctly aligned."
            FAIL=1

          fi

          echo "=== CHECK APK BADGING ==="

          if FINAL_BADGING="$("$AAPT" dump badging "$APK")"; then

            printf '%s\n' "$FINAL_BADGING" |
              sed -n '1,5p'

          else

            echo "::error::AAPT_BADGING_FAILED"
            echo "aapt could not read the final APK."
            FAIL=1
            FINAL_BADGING=""

          fi

          echo "=== CHECK PACKAGE ID ==="

          PACKAGE_LINE="$(
            printf '%s\n' "$FINAL_BADGING" |
            grep -F "package:" |
            head -n 1 || true
          )"

          echo "Actual package line: ${PACKAGE_LINE:-NOT FOUND}"

          if printf '%s\n' "$PACKAGE_LINE" |
            grep -Fq \
            "name='${FIVE_PACKAGE_ID}'"; then

            echo "OK: package ID = $FIVE_PACKAGE_ID"

          else

            echo "::error::PACKAGE_ID_CHECK_FAILED"
            echo "Expected package ID: $FIVE_PACKAGE_ID"
            echo "Actual: ${PACKAGE_LINE:-NOT FOUND}"
            FAIL=1

          fi

          echo "=== CHECK VERSION CODE ==="

          if printf '%s\n' "$PACKAGE_LINE" |
            grep -Fq \
            "versionCode='${FIVE_VERSION_CODE}'"; then

            echo "OK: versionCode = $FIVE_VERSION_CODE"

          else

            echo "::error::VERSION_CODE_CHECK_FAILED"
            echo "Expected versionCode: $FIVE_VERSION_CODE"
            echo "Actual: ${PACKAGE_LINE:-NOT FOUND}"
            FAIL=1

          fi

          echo "=== CHECK VERSION NAME ==="

          if printf '%s\n' "$PACKAGE_LINE" |
            grep -Fq \
            "versionName='${FIVE_VERSION}'"; then

            echo "OK: versionName = $FIVE_VERSION"

          else

            echo "::error::VERSION_NAME_CHECK_FAILED"
            echo "Expected versionName: $FIVE_VERSION"
            echo "Actual: ${PACKAGE_LINE:-NOT FOUND}"
            FAIL=1

          fi

          echo "========================================"

          if [ "$FAIL" -ne 0 ]; then
            echo "::error::FINAL APK VERIFICATION FAILED."
            echo "::error::See the specific CHECK_* error above."
            exit 1
          fi

          echo "FINAL APK VERIFICATION PASSED."

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-FIVE-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload final verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-FIVE-verified-apk
          path: bin/*.apk
          if-no-files-found: error
