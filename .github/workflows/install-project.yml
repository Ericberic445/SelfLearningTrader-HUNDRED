name: Build SelfLearningTrader FIVE

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - "**/*.zip"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find and extract project ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'SelfLearningTrader_FIVE_*.zip' \
              -not -path "$GITHUB_WORKSPACE/.git/*" \
              -print |
            sort -V |
            tail -n 1
          )"

          test -n "$ZIP"

          echo "Selected ZIP:"
          echo "$ZIP"

          unzip -q -t "$ZIP"

          INSTALL_ROOT="/tmp/five_project"

          rm -rf "$INSTALL_ROOT"
          mkdir -p "$INSTALL_ROOT"

          unzip -q -o "$ZIP" -d "$INSTALL_ROOT"

          ROOT="$INSTALL_ROOT"

          mapfile -t TOP < <(
            find "$INSTALL_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          echo "Project root:"
          echo "$ROOT"

          test -f "$ROOT/buildozer.spec"
          test -f "$ROOT/requirements.txt"
          test -f "$ROOT/app/main.py"
          test -f "$ROOT/signing/debug.keystore"

          echo "Project extracted successfully."

      - name: Prepare update version
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/tmp/five_project"

          mapfile -t TOP < <(
            find "$ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          PACKAGE_DOMAIN="$(
            sed -n \
              's/^[[:space:]]*package.domain[[:space:]]*=[[:space:]]*//p' \
              "$ROOT/buildozer.spec" |
            tail -n 1 |
            xargs
          )"

          PACKAGE_NAME="$(
            sed -n \
              's/^[[:space:]]*package.name[[:space:]]*=[[:space:]]*//p' \
              "$ROOT/buildozer.spec" |
            tail -n 1 |
            xargs
          )"

          VERSION="$(
            sed -n \
              's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' \
              "$ROOT/buildozer.spec" |
            tail -n 1 |
            xargs
          )"

          VERSION_CODE="$(
            sed -n \
              's/^[[:space:]]*android.numeric_version[[:space:]]*=[[:space:]]*//p' \
              "$ROOT/buildozer.spec" |
            tail -n 1 |
            xargs
          )"

          test "$PACKAGE_DOMAIN" = "org.selflearningtrader"
          test "$PACKAGE_NAME" = "selflearningtrader"
          test -n "$VERSION"
          test -n "$VERSION_CODE"

          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"

            NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"
          else
            echo "ERROR: Unsupported version: $VERSION"
            exit 1
          fi

          NEW_VERSION_CODE=$((VERSION_CODE + 1))

          sed -i \
            "s/^[[:space:]]*version[[:space:]]*=.*/version = ${NEW_VERSION}/" \
            "$ROOT/buildozer.spec"

          sed -i \
            "s/^[[:space:]]*android.numeric_version[[:space:]]*=.*/android.numeric_version = ${NEW_VERSION_CODE}/" \
            "$ROOT/buildozer.spec"

          echo "Package ID: ${PACKAGE_DOMAIN}.${PACKAGE_NAME}"
          echo "Old version: $VERSION"
          echo "New version: $NEW_VERSION"
          echo "Old version code: $VERSION_CODE"
          echo "New version code: $NEW_VERSION_CODE"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            zip \
            unzip \
            openjdk-17-jdk \
            autoconf \
            automake \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses5-dev \
            libncursesw5-dev \
            cmake \
            libffi-dev \
            libssl-dev

          python3 -m pip install --upgrade pip
          python3 -m pip install "cython<3" buildozer==1.5.0

      - name: Prepare fixed signing key
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/tmp/five_project"

          mapfile -t TOP < <(
            find "$ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          test -f "$ROOT/signing/debug.keystore"

          mkdir -p "$HOME/.android"

          cp \
            "$ROOT/signing/debug.keystore" \
            "$HOME/.android/debug.keystore"

          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          echo "Fixed signing key prepared."

      - name: Verify project before build
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/tmp/five_project"

          mapfile -t TOP < <(
            find "$ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          test -f "$ROOT/buildozer.spec"
          test -f "$ROOT/requirements.txt"
          test -f "$ROOT/app/main.py"
          test -f "$ROOT/signing/debug.keystore"

          grep -q \
            '^package.domain[[:space:]]*=[[:space:]]*org.selflearningtrader$' \
            "$ROOT/buildozer.spec"

          grep -q \
            '^package.name[[:space:]]*=[[:space:]]*selflearningtrader$' \
            "$ROOT/buildozer.spec"

          grep -q \
            '^version[[:space:]]*=' \
            "$ROOT/buildozer.spec"

          grep -q \
            '^android.numeric_version[[:space:]]*=' \
            "$ROOT/buildozer.spec"

          python3 -m compileall -q "$ROOT/app"

          echo "Project verification passed."

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/tmp/five_project"

          mapfile -t TOP < <(
            find "$ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          cd "$ROOT"

          export JAVA_HOME="/usr/lib/jvm/java-17-openjdk-amd64"
          export PATH="$JAVA_HOME/bin:$PATH"

          export GRADLE_OPTS="-Dorg.gradle.java.home=$JAVA_HOME"

          java -version
          javac -version

          rm -rf .buildozer bin

          buildozer -v android debug

          APK="$(
            find "$ROOT/bin" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print |
            sort -V |
            tail -n 1
          )"

          test -n "$APK"
          test -f "$APK"

          APKSIGNER="$(
            find "$ANDROID_HOME/build-tools" \
              -type f \
              -name apksigner \
              -print |
            sort -V |
            tail -n 1
          )"

          test -x "$APKSIGNER"

          "$APKSIGNER" sign \
            --ks "$ROOT/signing/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            "$APK"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

      - name: Locate final APK
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/tmp/five_project"

          mapfile -t TOP < <(
            find "$ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          APK="$(
            find "$ROOT/bin" \
              -maxdepth 1 \
              -type f \
              -name '*.apk' \
              -print |
            sort -V |
            tail -n 1
          )"

          test -n "$APK"
          test -f "$APK"

          echo "Final APK:"
          echo "$APK"

          mkdir -p "$GITHUB_WORKSPACE/final"

          cp \
            "$APK" \
            "$GITHUB_WORKSPACE/final/SelfLearningTrader-FIVE.apk"

          test -f \
            "$GITHUB_WORKSPACE/final/SelfLearningTrader-FIVE.apk"

      - name: Verify final APK
        shell: bash
        run: |
          set -euo pipefail

          ROOT="/tmp/five_project"

          mapfile -t TOP < <(
            find "$ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          APK="$GITHUB_WORKSPACE/final/SelfLearningTrader-FIVE.apk"

          test -f "$APK"

          SDK_ROOT="${ANDROID_HOME:-$HOME/.buildozer/android/platform/android-sdk}"

          AAPT="$(
            find "$SDK_ROOT/build-tools" \
              -type f \
              -name aapt \
              -print |
            sort -V |
            tail -n 1
          )"

          APKSIGNER="$(
            find "$SDK_ROOT/build-tools" \
              -type f \
              -name apksigner \
              -print |
            sort -V |
            tail -n 1
          )"

          test -x "$AAPT"
          test -x "$APKSIGNER"

          echo "=== APK BADGING ==="

          BADGING="$("$AAPT" dump badging "$APK")"

          echo "$BADGING"

          echo "$BADGING" |
            grep -q \
              "package: name='org.selflearningtrader.selflearningtrader'"

          ACTUAL_VERSION_CODE="$(
            echo "$BADGING" |
              sed -n \
                "s/.*versionCode='[^']*'.*/\1/p"
          )"

          ACTUAL_VERSION="$(
            echo "$BADGING" |
              sed -n \
                "s/.*versionName='[^']*'.*/\1/p"
          )"

          EXPECTED_VERSION_CODE="$(
            sed -n \
              's/^[[:space:]]*android.numeric_version[[:space:]]*=[[:space:]]*//p' \
              "$ROOT/buildozer.spec" |
            tail -n 1 |
            xargs
          )"

          EXPECTED
