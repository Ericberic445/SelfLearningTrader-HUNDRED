name: Installation Build HUNDRED

on:
  workflow_dispatch:
  push:
    paths:
      - "SelfLearningTrader_HUNDRED_*.zip"

permissions:
  contents: read

jobs:
  install-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select the only HUNDRED ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name 'SelfLearningTrader_HUNDRED_*.zip' \
              -print
          )

          if [ "${#ZIPS[@]}" -ne 1 ]; then
            echo "ERROR: Repository must contain exactly one SelfLearningTrader_HUNDRED_*.zip"
            echo "Found: ${#ZIPS[@]}"
            printf '%s\n' "${ZIPS[@]:-<none>}"
            exit 1
          fi

          ZIP="${ZIPS[0]}"

          echo "Selected ZIP: $ZIP"

          sha256sum "$ZIP"

          unzip -q -t "$ZIP"

          echo "ZIP archive test PASSED."

      - name: Extract project only to temporary workspace
        shell: bash
        run: |
          set -euo pipefail

          ZIP="$(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -name 'SelfLearningTrader_HUNDRED_*.zip' \
              -print
          )"

          TEMP_ROOT="/tmp/selflearningtrader_hundred"

          rm -rf "$TEMP_ROOT"
          mkdir -p "$TEMP_ROOT"

          unzip -q -o "$ZIP" -d "$TEMP_ROOT"

          ROOT="$TEMP_ROOT"

          mapfile -t TOP < <(
            find "$TEMP_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          test -f "$ROOT/buildozer.spec"
          test -f "$ROOT/requirements.txt"
          test -f "$ROOT/app/main.py"
          test -f "$ROOT/signing/debug.keystore"

          echo "TEMP_PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

          echo "Temporary project:"
          echo "$ROOT"

      - name: Set version from ZIP filename
        shell: bash
        run: |
          set -euo pipefail

          cd "$TEMP_PROJECT_ROOT"

          ZIP_NAME="$(
            basename "$(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 1 \
                -type f \
                -name 'SelfLearningTrader_HUNDRED_*.zip' \
                -print
            )"
          )"

          VERSION="$(
            printf '%s\n' "$ZIP_NAME" |
            sed -n \
              's/^SelfLearningTrader_HUNDRED_\([0-9]\+\.[0-9]\+\.[0-9]\+\).*$/\1/p'
          )"

          test -n "$VERSION"

          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"

          NUMERIC_VERSION=$(
            (
              10#$MAJOR * 10000 +
              10#$MINOR * 100 +
              10#$PATCH
            )
          )

          test "$NUMERIC_VERSION" -ge 10203

          echo "ZIP version: $VERSION"
          echo "APK version code: $NUMERIC_VERSION"

          sed -i \
            -E \
            "s/^version[[:space:]]*=.*/version = $VERSION/" \
            buildozer.spec

          sed -i \
            -E \
            "s/^android\.numeric_version[[:space:]]*=.*/android.numeric_version = $NUMERIC_VERSION/" \
            buildozer.spec

          echo "=== FINAL BUILD VERSION ==="

          grep -E \
            '^(version|android.numeric_version)[[:space:]]*=' \
            buildozer.spec

      - name: Install Java 17 and Android build dependencies
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ant autoconf automake autopoint ccache cmake \
            g++ gcc gettext git lbzip2 \
            libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev \
            libssl-dev libtool make patch pkg-config \
            python3 python3-dev python3-pip python3-venv \
            rsync unzip wget zip zlib1g-dev

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            "cython==3.0.12" \
            "buildozer==1.5.0"

      - name: Verify Java 17
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"

          JAVA_VERSION="$(java -version 2>&1 | head -n 1)"
          JAVAC_VERSION="$(javac -version 2>&1 | head -n 1)"

          echo "$JAVA_VERSION"
          echo "$JAVAC_VERSION"

          printf '%s\n' "$JAVA_VERSION" |
            grep -qE 'version "17\.'

          printf '%s\n' "$JAVAC_VERSION" |
            grep -qE '^javac 17\.'

          echo "Java 17 verification PASSED."

      - name: Verify project before build
        shell: bash
        run: |
          set -euo pipefail

          cd "$TEMP_PROJECT_ROOT"

          test -f buildozer.spec
          test -f requirements.txt
          test -f app/main.py
          test -f signing/debug.keystore

          PACKAGE_DOMAIN="$(
            sed -n \
              's/^[[:space:]]*package.domain[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          PACKAGE_NAME="$(
            sed -n \
              's/^[[:space:]]*package.name[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          VERSION="$(
            sed -n \
              's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          NUMERIC_VERSION="$(
            sed -n \
              's/^[[:space:]]*android.numeric_version[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          test "$PACKAGE_DOMAIN" = "org.selflearningtrader"
          test "$PACKAGE_NAME" = "hundred"
          test "$VERSION" = "1.0.203"
          test "$NUMERIC_VERSION" = "10203"

          PACKAGE_ID="${PACKAGE_DOMAIN}.${PACKAGE_NAME}"

          echo "Package ID: $PACKAGE_ID"
          echo "Version: $VERSION"
          echo "Version code: $NUMERIC_VERSION"

          python3 -m compileall -q app

          mkdir -p "$HOME/.android"

          cp signing/debug.keystore \
            "$HOME/.android/debug.keystore"

          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

          echo "Project verification PASSED."

      - name: Clean temporary Android state
        shell: bash
        run: |
          set -euo pipefail

          cd "$TEMP_PROJECT_ROOT"

          rm -rf .buildozer bin signed

          find . \
            -type d \
            -name '__pycache__' \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            \( -name '*.pyc' -o -name '*.pyo' \) \
            -delete

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail

          cd "$TEMP_PROJECT_ROOT"

          echo "Building from temporary directory:"
          pwd

          java -version
          javac -version

          buildozer -v android debug 2>&1 |
            tee "$GITHUB_WORKSPACE/build.log"

      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$HOME/.buildozer" \
              -type f \
              -name apksigner \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          ZIPALIGN="$(
            find "$HOME/.buildozer" \
              -type f \
              -name zipalign \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          AAPT="$(
            find "$HOME/.buildozer" \
              -type f \
              -name aapt \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          test -n "$AAPT"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT"

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

          "$APKSIGNER" version
          "$AAPT" version

      - name: Check generated APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$TEMP_PROJECT_ROOT"

          mapfile -t APKS < <(
            find bin \
              -type f \
              -name '*.apk' \
              -print
          )

          test "${#APKS[@]}" -eq 1

          APK="${APKS[0]}"

          echo "Generated APK: $APK"
          ls -lh "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"

          printf '%s\n' "$BADGING"

          printf '%s\n' "$BADGING" |
            grep -q \
            "package: name='org.selflearningtrader.hundred'"

          printf '%s\n' "$BADGING" |
            grep -q \
            "versionCode='10203'"

          printf '%s\n' "$BADGING" |
            grep -q \
            "versionName='1.0.203'"

          echo "Generated APK identity PASSED."

      - name: Align and sign with permanent project key
        shell: bash
        run: |
          set -euo pipefail

          cd "$TEMP_PROJECT_ROOT"

          APK="$(
            find bin \
              -type f \
              -name '*.apk' \
              -print
          )"

          rm -rf signed
          mkdir -p signed

          "$ZIPALIGN" -f -p 4 \
            "$APK" \
            signed/aligned.apk

          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out signed/final.apk \
            signed/aligned.apk

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            signed/final.apk

          cp signed/final.apk \
            "$GITHUB_WORKSPACE/SelfLearningTrader-HUNDRED-1.0.203.apk"

          echo "SIGNED_APK=$GITHUB_WORKSPACE/SelfLearningTrader-HUNDRED-1.0.203.apk" \
            >> "$GITHUB_ENV"

      - name: Final APK verification
        shell: bash
        run: |
          set -euo pipefail

          APK="$SIGNED_APK"

          test -f "$APK"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" |
            tee "$GITHUB_WORKSPACE/apk-cert.txt"

          grep -q \
            "Verified using v1 scheme (JAR signing): true" \
            "$GITHUB_WORKSPACE/apk-cert.txt"

          grep -q \
            "Verified using v2 scheme (APK Signature Scheme v2): true" \
            "$GITHUB_WORKSPACE/apk-cert.txt"

          grep -q \
            "Verified using v3 scheme (APK Signature Scheme v3): true" \
            "$GITHUB_WORKSPACE/apk-cert.txt"

          KEY_SHA="$(
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey |
            awk -F': ' \
              '/SHA256:/{print $2; exit}'
          )"

          APK_SHA="$(
            awk '
              /certificate SHA-256 digest:/ {
                getline
                gsub(/[[:space:]]/, "", $0)
                print $0
                exit
              }
            ' "$GITHUB_WORKSPACE/apk-cert.txt"
          )"

          KEY_SHA="$(
            printf '%s' "$KEY_SHA" |
            tr -d '[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )"

          APK_SHA="$(
            printf '%s' "$APK_SHA" |
            tr -d '[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )"

          test -n "$KEY_SHA"
          test -n "$APK_SHA"

          echo "Keystore SHA-256: $KEY_SHA"
          echo "APK SHA-256:      $APK_SHA"

          test "$KEY_SHA" = "$APK_SHA"

          "$ZIPALIGN" -c -P 4 -v 4 "$APK"

          FINAL_BADGING="$("$AAPT" dump badging "$APK")"

          printf '%s\n' "$FINAL_BADGING" |
            grep -q \
            "package: name='org.selflearningtrader.hundred'"

          printf '%s\n' "$FINAL_BADGING" |
            grep -q \
            "versionCode='10203'"

          printf '%s\n' "$FINAL_BADGING" |
            grep -q \
            "versionName='1.0.203'"

          echo "========================================"
          echo "FINAL APK VERIFICATION PASSED"
          echo "Package: org.selflearningtrader.hundred"
          echo "Version: 1.0.203"
          echo "Version code: 10203"
          echo "Signing certificate matches project key"
          echo "ZIP alignment PASSED"
          echo "========================================"

      - name: Upload final APK only
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-HUNDRED-1.0.203
          path: SelfLearningTrader-HUNDRED-1.0.203.apk
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log only on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-HUNDRED-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Remove temporary build files
        if: always()
        shell: bash
        run: |
          set +e

          rm -rf /tmp/selflearningtrader_hundred

          rm -f "$GITHUB_WORKSPACE/build.log"
          rm -f "$GITHUB_WORKSPACE/apk-cert.txt"
          rm -f "$GITHUB_WORKSPACE/SelfLearningTrader-HUNDRED-1.0.203.apk"

          echo "Temporary build files removed."
