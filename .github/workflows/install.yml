name: Installation Build HUNDRED

on:
  workflow_dispatch:
  push:
    paths:
      - "*.zip"
      - ".github/workflows/**"

permissions:
  contents: read

jobs:
  install-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Find project ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -maxdepth 1 \
              -type f \
              -iname '*.zip' \
              -print
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP file found in repository root."
            exit 1
          fi

          echo "ZIP files found:"
          printf '  %s\n' "${ZIPS[@]}"

          PROJECT_ZIP=""

          for ZIP in "${ZIPS[@]}"; do
            if unzip -Z1 "$ZIP" 2>/dev/null |
              grep -qE '(^|/)buildozer\.spec$'; then

              if [ -n "$PROJECT_ZIP" ]; then
                echo "ERROR: More than one ZIP containing buildozer.spec was found."
                echo "First:  $PROJECT_ZIP"
                echo "Second: $ZIP"
                exit 1
              fi

              PROJECT_ZIP="$ZIP"
            fi
          done

          if [ -z "$PROJECT_ZIP" ]; then
            echo "ERROR: No ZIP containing buildozer.spec was found."

            for ZIP in "${ZIPS[@]}"; do
              echo "----- $ZIP -----"
              unzip -Z1 "$ZIP" 2>/dev/null || true
            done

            exit 1
          fi

          echo "Selected project ZIP:"
          echo "$PROJECT_ZIP"

          unzip -q -t "$PROJECT_ZIP"

          echo "ZIP archive test PASSED."
          echo "SELECTED_ZIP=$PROJECT_ZIP" >> "$GITHUB_ENV"

      - name: Extract project
        shell: bash
        run: |
          set -euo pipefail

          TEMP_ROOT="/tmp/selflearningtrader_hundred"

          rm -rf "$TEMP_ROOT"
          mkdir -p "$TEMP_ROOT"

          unzip -q -o "$SELECTED_ZIP" -d "$TEMP_ROOT"

          mapfile -t SPECS < <(
            find "$TEMP_ROOT" \
              -type f \
              -name "buildozer.spec" \
              -print
          )

          if [ "${#SPECS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one buildozer.spec."
            echo "Found: ${#SPECS[@]}"
            printf '%s\n' "${SPECS[@]:-<none>}"
            exit 1
          fi

          ROOT="$(dirname "${SPECS[0]}")"

          test -f "$ROOT/buildozer.spec"
          test -f "$ROOT/requirements.txt"
          test -f "$ROOT/app/main.py"
          test -f "$ROOT/signing/debug.keystore"

          echo "Project root:"
          echo "$ROOT"

          echo "TEMP_PROJECT_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Read project identity
        shell: bash
        run: |
          set -euo pipefail

          cd "$TEMP_PROJECT_ROOT"

          DOMAIN="$(
            sed -n \
              's/^[[:space:]]*package\.domain[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          NAME="$(
            sed -n \
              's/^[[:space:]]*package\.name[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          VERSION="$(
            sed -n \
              's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          VERSION_CODE="$(
            sed -n \
              's/^[[:space:]]*android\.numeric_version[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          PACKAGE_ID="${DOMAIN}.${NAME}"

          echo "Package: $PACKAGE_ID"
          echo "Version: $VERSION"
          echo "Version code: $VERSION_CODE"

          test "$PACKAGE_ID" = "org.selflearningtrader.hundred"
          test -n "$VERSION"
          test -n "$VERSION_CODE"

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ERROR: Invalid version format: $VERSION"
            exit 1
          fi

          if ! [[ "$VERSION_CODE" =~ ^[0-9]+$ ]]; then
            echo "ERROR: Invalid version code: $VERSION_CODE"
            exit 1
          fi

          if [ "$VERSION_CODE" -lt 10203 ]; then
            echo "ERROR: Version code must be at least 10203."
            exit 1
          fi

          echo "PACKAGE_ID=$PACKAGE_ID" >> "$GITHUB_ENV"
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            make \
            patch \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            wget \
            zip \
            zlib1g-dev

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            "cython==3.0.12" \
            "buildozer==1.5.0"

      - name: Verify Java 17
        shell: bash
        run: |
          set -euo pipefail

          JAVA_VERSION="$(java -version 2>&1 | head -n 1)"
          JAVAC_VERSION="$(javac -version 2>&1 | head -n 1)"

          echo "$JAVA_VERSION"
          echo "$JAVAC_VERSION"

          printf '%s\n' "$JAVA_VERSION" |
            grep -qE 'version "17\.'

          printf '%s\n' "$JAVAC_VERSION" |
            grep -qE '^javac 17\.'

          echo "Java 17 verification PASSED."

      - name: Verify project before build
        shell: bash
        run: |
          set -euo pipefail

          cd "$TEMP_PROJECT_ROOT"

          test -f buildozer.spec
          test -f requirements.txt
          test -f app/main.py
          test -f signing/debug.keystore

          python3 -m compileall -q app

          mkdir -p "$HOME/.android"

          cp \
            signing/debug.keystore \
            "$HOME/.android/debug.keystore"

          chmod 600 "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey

      - name: Clean temporary Android state
        shell: bash
        run: |
          set -euo pipefail

          cd "$TEMP_PROJECT_ROOT"

          rm -rf \
            .buildozer \
            bin \
            signed

          find . \
            -type d \
            -name "__pycache__" \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

      - name: Build Android APK
        shell: bash
        run: |
          set -o pipefail

          cd "$TEMP_PROJECT_ROOT"

          java -version
          javac -version

          buildozer -v android debug 2>&1 |
            tee "$GITHUB_WORKSPACE/build.log"

      - name: Locate Android build tools
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$HOME/.buildozer" \
              -type f \
              -name "apksigner" \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          ZIPALIGN="$(
            find "$HOME/.buildozer" \
              -type f \
              -name "zipalign" \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          AAPT="$(
            find "$HOME/.buildozer" \
              -type f \
              -name "aapt" \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          test -n "$AAPT"

          test -x "$APKSIGNER"
          test -x "$ZIPALIGN"
          test -x "$AAPT"

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

          "$APKSIGNER" version
          "$AAPT" version

      - name: Check generated APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$TEMP_PROJECT_ROOT"

          mapfile -t APKS < <(
            find bin \
              -type f \
              -name "*.apk" \
              -print
          )

          if [ "${#APKS[@]}" -ne 1 ]; then
            echo "ERROR: Expected exactly one generated APK."
            echo "Found: ${#APKS[@]}"
            printf '%s\n' "${APKS[@]:-<none>}"
            exit 1
          fi

          APK="${APKS[0]}"

          echo "Generated APK:"
          echo "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"

          printf '%s\n' "$BADGING"

          printf '%s\n' "$BADGING" |
            grep -q "package: name='$PACKAGE_ID'"

          APK_VERSION="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/.*versionName='\([^']*\)'.*/\1/p" |
            head -n 1
          )"

          APK_VERSION_CODE="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" |
            head -n 1
          )"

          test "$APK_VERSION" = "$BUILD_VERSION"
          test "$APK_VERSION_CODE" = "$BUILD_VERSION_CODE"

          echo "Generated APK identity PASSED."

          echo "GENERATED_APK=$APK" >> "$GITHUB_ENV"

      - name: Align and sign APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$TEMP_PROJECT_ROOT"

          rm -rf signed
          mkdir -p signed

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$GENERATED_APK" \
            signed/aligned.apk

          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out signed/final.apk \
            signed/aligned.apk

          test -f signed/final.apk

          echo "SIGNED_APK=$TEMP_PROJECT_ROOT/signed/final.apk" \
            >> "$GITHUB_ENV"

      - name: Final APK verification
        shell: bash
        run: |
          set -euo pipefail

          APK="$SIGNED_APK"

          test -f "$APK"

          echo "=== APK SIGNATURE VERIFICATION ==="

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK"

          echo "=== APK PACKAGE / VERSION ==="

          FINAL_BADGING="$("$AAPT" dump badging "$APK")"

          printf '%s\n' "$FINAL_BADGING"

          printf '%s\n' "$FINAL_BADGING" |
            grep -q "package: name='$PACKAGE_ID'"

          FINAL_VERSION="$(
            printf '%s\n' "$FINAL_BADGING" |
            sed -n "s/.*versionName='\([^']*\)'.*/\1/p" |
            head -n 1
          )"

          FINAL_VERSION_CODE="$(
            printf '%s\n' "$FINAL_BADGING" |
            sed -n "s/.*versionCode='\([^']*\)'.*/\1/p" |
            head -n 1
          )"

          echo "Final APK version: $FINAL_VERSION"
          echo "Final APK version code: $FINAL_VERSION_CODE"

          test "$FINAL_VERSION" = "$BUILD_VERSION"
          test "$FINAL_VERSION_CODE" = "$BUILD_VERSION_CODE"

          echo "=== ZIPALIGN VERIFICATION ==="

          "$ZIPALIGN" \
            -c \
            -P 4 \
            -v 4 \
            "$APK"

          echo "FINAL APK VERIFICATION PASSED."

      - name: Upload final APK artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-HUNDRED-${{ env.BUILD_VERSION }}
          path: ${{ env.SIGNED_APK }}
          if-no-files-found: error
          retention-days: 7

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-HUNDRED-build-log
          path: build.log
          if-no-files-found: warn
          retention-days: 3

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          set +e

          rm -rf /tmp/selflearningtrader_hundred
          rm -f "$GITHUB_WORKSPACE/build.log"
