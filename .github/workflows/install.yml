name: Install and Build HUNDRED

on:
  workflow_dispatch:

  push:
    paths:
      - "SelfLearningTrader_HUNDRED_*.zip"
      - "**/SelfLearningTrader_HUNDRED_*.zip"

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0


      # ============================================================
      # JAVA 17
      # ============================================================

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"


      # ============================================================
      # FIND AND EXTRACT THE NEWEST HUNDRED ZIP
      # ============================================================

      - name: Select and extract HUNDRED ZIP
        shell: bash
        run: |
          set -euo pipefail

          echo "Searching for HUNDRED ZIP..."

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'SelfLearningTrader_HUNDRED_*.zip' \
              -not -path "$GITHUB_WORKSPACE/.git/*" \
              -printf '%T@ %p\n' |
            sort -nr |
            sed 's/^[^ ]* //'
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No SelfLearningTrader_HUNDRED_*.zip found."
            exit 1
          fi

          ZIP="${ZIPS[0]}"

          echo
          echo "========================================"
          echo "SELECTED HUNDRED ZIP"
          echo "========================================"
          echo "$ZIP"
          echo

          sha256sum "$ZIP"

          echo
          echo "Testing ZIP..."

          unzip -q -t "$ZIP"

          echo "ZIP test PASSED."

          INSTALL_ROOT="/tmp/hundred_project"

          rm -rf "$INSTALL_ROOT"
          mkdir -p "$INSTALL_ROOT"

          unzip -q -o "$ZIP" -d "$INSTALL_ROOT"

          ROOT="$INSTALL_ROOT"

          mapfile -t TOP < <(
            find "$INSTALL_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          echo
          echo "Project root:"
          echo "$ROOT"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$ROOT"/ "$GITHUB_WORKSPACE"/

          rm -rf "$INSTALL_ROOT"

          cd "$GITHUB_WORKSPACE"

          test -f buildozer.spec
          test -f requirements.txt
          test -f app/main.py
          test -f signing/debug.keystore

          echo
          echo "========================================"
          echo "INSTALLED PROJECT"
          echo "========================================"

          grep -E \
            '^[[:space:]]*(package.name|package.domain|version|android.numeric_version)[[:space:]]*=' \
            buildozer.spec || true


      # ============================================================
      # SYSTEM DEPENDENCIES
      # ============================================================

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            wget \
            zip \
            zlib1g-dev

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            "cython==3.0.12" \
            "buildozer==1.5.0"


      # ============================================================
      # FORCE JAVA 17
      # ============================================================

      - name: Force Java 17
        shell: bash
        run: |
          set -euo pipefail

          JAVA17=""

          for J in \
            "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17"/*/x64 \
            "/usr/lib/jvm/temurin-17-jdk-amd64" \
            "/usr/lib/jvm/java-17-openjdk-amd64"
          do
            if [ -x "$J/bin/java" ]; then
              JAVA17="$J"
              break
            fi
          done

          if [ -z "$JAVA17" ]; then
            echo "ERROR: Java 17 installation not found."
            exit 1
          fi

          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"
          echo "$JAVA17/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA17"
          export PATH="$JAVA_HOME/bin:$PATH"

          java -version
          javac -version

          JAVA_MAJOR="$(
            java -version 2>&1 |
            sed -n 's/.*version "\([0-9]*\).*/\1/p' |
            head -n 1
          )"

          if [ "$JAVA_MAJOR" != "17" ]; then
            echo "ERROR: Java 17 required."
            exit 1
          fi

          echo "Java 17 verification PASSED."


      # ============================================================
      # VERIFY PROJECT
      # ============================================================

      - name: Verify installed project and signing key
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          test -f buildozer.spec
          test -f requirements.txt
          test -f app/main.py
          test -f signing/debug.keystore

          PACKAGE_DOMAIN="$(
            sed -n \
              's/^[[:space:]]*package.domain[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          PACKAGE_NAME="$(
            sed -n \
              's/^[[:space:]]*package.name[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          VERSION="$(
            sed -n \
              's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          VERSION_CODE="$(
            sed -n \
              's/^[[:space:]]*android.numeric_version[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          test -n "$PACKAGE_DOMAIN"
          test -n "$PACKAGE_NAME"
          test -n "$VERSION"
          test -n "$VERSION_CODE"

          PACKAGE_ID="${PACKAGE_DOMAIN}.${PACKAGE_NAME}"

          echo
          echo "========================================"
          echo "PROJECT INFORMATION"
          echo "========================================"
          echo "Package ID   : $PACKAGE_ID"
          echo "Version      : $VERSION"
          echo "Version code : $VERSION_CODE"
          echo "========================================"

          if [ "$PACKAGE_ID" != "org.selflearningtrader.hundred" ]; then
            echo "ERROR: Wrong package ID."
            exit 1
          fi

          {
            echo "HUNDRED_PACKAGE_ID=$PACKAGE_ID"
            echo "HUNDRED_VERSION=$VERSION"
            echo "HUNDRED_VERSION_CODE=$VERSION_CODE"
          } >> "$GITHUB_ENV"

          echo
          echo "Python syntax check..."

          python3 -m compileall -q app

          echo "Python syntax check PASSED."

          echo
          echo "Installing signing key..."

          mkdir -p "$HOME/.android"

          cp \
            signing/debug.keystore \
            "$HOME/.android/debug.keystore"

          chmod 600 \
            "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          KEY_SHA="$(
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey |
            awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          KEY_SHA="$(
            echo "$KEY_SHA" |
            tr -d ':[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )"

          if [ -z "$KEY_SHA" ]; then
            echo "ERROR: Could not read signing key SHA-256."
            exit 1
          fi

          echo
          echo "Signing key SHA-256:"
          echo "$KEY_SHA"

          echo "HUNDRED_KEY_SHA=$KEY_SHA" >> "$GITHUB_ENV"

          echo
          echo "Signing key verification PASSED."


      # ============================================================
      # CLEAN BUILD STATE
      # ============================================================

      - name: Clean Android build state
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf \
            .buildozer \
            bin \
            signed

          find . \
            -type d \
            -name '__pycache__' \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            \( -name '*.pyc' -o -name '*.pyo' \) \
            -delete

          echo "Android build state cleaned."


      # ============================================================
      # VERIFY JAVA BEFORE BUILD
      # ============================================================

      - name: Verify Java before Android build
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"

          which java
          which javac

          java -version
          javac -version

          JAVA_MAJOR="$(
            java -version 2>&1 |
            sed -n 's/.*version "\([0-9]*\).*/\1/p' |
            head -n 1
          )"

          if [ "$JAVA_MAJOR" != "17" ]; then
            echo "ERROR: Java 17 is not active."
            exit 1
          fi

          echo "Java 17 confirmed."


      # ============================================================
      # BUILD ANDROID APK
      # ============================================================

      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          export JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo
          echo "========================================"
          echo "ANDROID BUILD"
          echo "========================================"

          java -version
          javac -version

          buildozer -v android debug 2>&1 | tee build.log

          echo
          echo "Buildozer completed successfully."

          mapfile -t BUILT_APKS < <(
            find bin \
              -type f \
              -name '*.apk' \
              -print
          )

          if [ "${#BUILT_APKS[@]}" -eq 0 ]; then
            echo "ERROR: Buildozer completed but no APK was produced."
            exit 1
          fi

          echo
          echo "Produced APK:"
          printf '%s\n' "${BUILT_APKS[@]}"


      # ============================================================
      # LOCATE ANDROID SIGNING TOOLS
      # ============================================================

      - name: Locate Android signing tools
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$HOME/.buildozer" \
              -type f \
              -name apksigner \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          ZIPALIGN="$(
            find "$HOME/.buildozer" \
              -type f \
              -name zipalign \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          AAPT="$(
            find "$HOME/.buildozer" \
              -type f \
              -name aapt \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          if [ -z "$APKSIGNER" ]; then
            echo "ERROR: apksigner not found."
            exit 1
          fi

          if [ -z "$ZIPALIGN" ]; then
            echo "ERROR: zipalign not found."
            exit 1
          fi

          if [ -z "$AAPT" ]; then
            echo "ERROR: aapt not found."
            exit 1
          fi

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

          echo
          echo "========================================"
          echo "ANDROID TOOLS"
          echo "========================================"

          echo "apksigner:"
          echo "$APKSIGNER"

          echo "zipalign:"
          echo "$ZIPALIGN"

          echo "aapt:"
          echo "$AAPT"

          echo
          echo "Checking apksigner..."
          "$APKSIGNER" version

          echo
          echo "Checking aapt..."
          "$AAPT" version

          echo
          echo "Android signing tools located successfully."


      # ============================================================
      # VERIFY BUILD APK PACKAGE AND VERSION
      # ============================================================

      - name: Verify build APK package and version
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          APK="$(
            find bin \
              -type f \
              -name '*.apk' \
              -print |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK found."
            exit 1
          fi

          echo
          echo "Build APK:"
          echo "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo
          echo "APK BADGING:"
          printf '%s\n' "$BADGING"

          APK_PACKAGE="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/^package: name='\([^']*\)'.*/\1/p" |
            head -n 1
          )"

          APK_VERSION_CODE="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/^package:.*versionCode='\([^']*\)'.*/\1/p" |
            head -n 1
          )"

          APK_VERSION="$(
            printf '%s\n' "$BADGING" |
            sed -n "s/^package:.*versionName='\([^']*\)'.*/\1/p" |
            head -n 1
          )"

          echo
          echo "Detected package:"
          echo "$APK_PACKAGE"

          echo "Detected version:"
          echo "$APK_VERSION"

          echo "Detected version code:"
          echo "$APK_VERSION_CODE"

          if [ "$APK_PACKAGE" != "$HUNDRED_PACKAGE_ID" ]; then
            echo "ERROR: APK package mismatch."
            exit 1
          fi

          if [ "$APK_VERSION" != "$HUNDRED_VERSION" ]; then
            echo "ERROR: APK version mismatch."
            exit 1
          fi

          if [ "$APK_VERSION_CODE" != "$HUNDRED_VERSION_CODE" ]; then
            echo "ERROR: APK version code mismatch."
            exit 1
          fi

          echo
          echo "APK package/version verification PASSED."


      # ============================================================
      # ALIGN APK
      # ============================================================

      - name: Align APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          APK="$(
            find bin \
              -type f \
              -name '*.apk' \
              -print |
            head -n 1
          )"

          if [ -z "$APK" ]; then
            echo "ERROR: APK not found."
            exit 1
          fi

          rm -rf signed
          mkdir -p signed

          echo "Aligning APK..."

          "$ZIPALIGN" \
            -f \
            -p \
            4 \
            "$APK" \
            signed/aligned.apk

          test -f signed/aligned.apk

          echo
          echo "APK alignment completed."

          echo
          echo "Checking alignment..."

          "$ZIPALIGN" \
            -c \
            -v \
            4 \
            signed/aligned.apk

          echo
          echo "ZIPALIGN verification PASSED."


      # ============================================================
      # SIGN APK
      # ============================================================

      - name: Sign APK with fixed HUNDRED key
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          test -f signed/aligned.apk

          echo
          echo "Signing APK..."

          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out signed/final.apk \
            signed/aligned.apk

          test -f signed/final.apk

          rm -f bin/*.apk

          cp \
            signed/final.apk \
            bin/hundred-final.apk

          echo
          echo "Final APK:"
          ls -lh bin/hundred-final.apk


      # ============================================================
      # FINAL APK VERIFICATION
      # ============================================================

      - name: Verify final APK identity alignment and certificate
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          APK="$GITHUB_WORKSPACE/bin/hundred-final.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: Final APK not found."
            exit 1
          fi

          echo
          echo "========================================"
          echo "FINAL APK VERIFICATION"
          echo "========================================"

          # --------------------------------------------------------
          # APKSIGNER
          # --------------------------------------------------------

          set +e

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" \
            > apk-cert.txt \
            2>&1

          VERIFY_EXIT=$?

          set -e

          cat apk-cert.txt

          if [ "$VERIFY_EXIT" -ne 0 ]; then
            echo
            echo "ERROR: apksigner verification FAILED."
            exit "$VERIFY_EXIT"
          fi

          echo
          echo "apksigner verification PASSED."


          # --------------------------------------------------------
          # EXTRACT APK CERTIFICATE SHA-256
          # --------------------------------------------------------

          APK_SHA="$(
            awk '
              /certificate SHA-256 digest:/ {
                line=$0
                sub(/^.*certificate SHA-256 digest:[[:space:]]*/, "", line)

                if (line != "") {
                  print line
                  exit
                }

                getline line
                gsub(/^[ \t]+|[ \t]+$/, "", line)
                print line
                exit
              }
            ' apk-cert.txt
          )"

          if [ -z "$APK_SHA" ]; then
            APK_SHA="$(
              grep -i \
                "certificate SHA-256 digest:" \
                apk-cert.txt |
              h
