name: Install and Build HUNDRED

on:
  workflow_dispatch:
  push:
    paths:
      - 'SelfLearningTrader_HUNDRED_*.zip'

permissions:
  contents: read

jobs:
  install-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select and extract HUNDRED ZIP
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t ZIPS < <(find "$GITHUB_WORKSPACE" -maxdepth 1 -type f -name 'SelfLearningTrader_HUNDRED_*.zip' -print | sort -V)
          test "${#ZIPS[@]}" -gt 0
          ZIP="${ZIPS[${#ZIPS[@]}-1]}"
          echo "Selected ZIP: $ZIP"
          unzip -q -t "$ZIP"

          # IMPORTANT: extract outside the repository.
          # The previous workflow extracted inside the repository and then rsync --delete
          # deleted files from its own source, causing rsync error 24.
          rm -rf /tmp/hundred_project
          mkdir -p /tmp/hundred_project
          unzip -q -o "$ZIP" -d /tmp/hundred_project

          mapfile -t TOP < <(find /tmp/hundred_project -mindepth 1 -maxdepth 1 -print)
          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          else
            ROOT="/tmp/hundred_project"
          fi
          echo "Extracted project root: $ROOT"

          # Copy the project into the runner workspace, but preserve the current
          # bootstrap workflow. No git push is performed by this workflow.
          rsync -a --delete --exclude='.git/' --exclude='.github/' "$ROOT"/ "$GITHUB_WORKSPACE"/

          test -f "$GITHUB_WORKSPACE/buildozer.spec"
          test -f "$GITHUB_WORKSPACE/requirements.txt"
          test -f "$GITHUB_WORKSPACE/app/main.py"
          test -f "$GITHUB_WORKSPACE/p4a-recipes/kivy/__init__.py"

      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            ant autoconf automake autopoint ccache cmake \
            g++ gcc gettext git lbzip2 \
            libffi-dev libltdl-dev libncurses5-dev libncursesw5-dev \
            libssl-dev libtool make openjdk-17-jdk patch pkg-config \
            python3 python3-dev python3-pip python3-venv rsync \
            unzip wget zip zlib1g-dev
          python3 -m pip install --upgrade pip
          python3 -m pip install 'cython==3.0.12' buildozer==1.5.0

      - name: Verify project before build
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          echo '=== buildozer.spec ==='
          cat buildozer.spec
          echo '=== requirements.txt ==='
          cat requirements.txt
          echo '=== required files ==='
          test -f app/main.py
          test -f p4a-recipes/kivy/__init__.py
          grep -q '^p4a.local_recipes = p4a-recipes$' buildozer.spec
          grep -q '^p4a.branch = v2026.05.09$' buildozer.spec
          grep -q '^requirements = python3,kivy==2.3.1,numpy,certifi$' buildozer.spec
          ! grep -RniE 'requests|charset[-_]normalizer|urllib3|pandas|scikit-learn|joblib' buildozer.spec requirements.txt app
          test "$(python3 -c 'import Cython; print(Cython.__version__)')" = '3.0.12'
          python3 -m compileall -q app
          echo '=== verification passed ==='

      - name: Build Android APK
        shell: bash
        run: |
          set +e
          cd "$GITHUB_WORKSPACE"
          export JAVA_HOME="$(dirname "$(dirname "$(readlink -f "$(command -v javac)")")")"
          export PATH="$JAVA_HOME/bin:$PATH"
          rm -rf .buildozer bin
          java -version
          javac -version
          buildozer -v android debug 2>&1 | tee build.log
          STATUS=${PIPESTATUS[0]}
          exit "$STATUS"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-HUNDRED-build-log
          path: build.log
          if-no-files-found: warn

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-HUNDRED-debug-apk
          path: bin/*.apk
          if-no-files-found: error
