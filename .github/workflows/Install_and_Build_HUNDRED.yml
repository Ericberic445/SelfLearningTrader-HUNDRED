name: Install and Build HUNDRED

on:
  workflow_dispatch:
  push:
    paths:
      - "SelfLearningTrader_HUNDRED_*.zip"
      - "**/SelfLearningTrader_HUNDRED_*.zip"

permissions:
  contents: write

jobs:
  install-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # JAVA 17
      # ============================================================
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      # ============================================================
      # FIND AND EXTRACT THE NEWEST HUNDRED ZIP
      # VERSION NUMBER IS NOT HARDCODED
      # ============================================================
      - name: Select and extract HUNDRED ZIP
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIPS < <(
            find "$GITHUB_WORKSPACE" \
              -type f \
              -name 'SelfLearningTrader_HUNDRED_*.zip' \
              -not -path "$GITHUB_WORKSPACE/.git/*" \
              -printf '%T@ %p\n' |
            sort -nr |
            sed 's/^[^ ]* //'
          )

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No SelfLearningTrader_HUNDRED_*.zip found."
            exit 1
          fi

          ZIP="${ZIPS[0]}"

          echo "========================================"
          echo "SELECTED HUNDRED ZIP"
          echo "========================================"
          echo "$ZIP"
          echo

          sha256sum "$ZIP"

          echo "Checking ZIP..."
          unzip -q -t "$ZIP"

          INSTALL_ROOT="/tmp/hundred_project"

          rm -rf "$INSTALL_ROOT"
          mkdir -p "$INSTALL_ROOT"

          unzip -q -o "$ZIP" -d "$INSTALL_ROOT"

          ROOT="$INSTALL_ROOT"

          mapfile -t TOP < <(
            find "$INSTALL_ROOT" \
              -mindepth 1 \
              -maxdepth 1 \
              -print
          )

          if [ "${#TOP[@]}" -eq 1 ] && [ -d "${TOP[0]}" ]; then
            ROOT="${TOP[0]}"
          fi

          echo "Project root: $ROOT"

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            "$ROOT"/ "$GITHUB_WORKSPACE"/

          rm -rf "$INSTALL_ROOT"

          cd "$GITHUB_WORKSPACE"

          test -f buildozer.spec
          test -f requirements.txt
          test -f app/main.py
          test -f signing/debug.keystore

          echo
          echo "========================================"
          echo "INSTALLED PROJECT"
          echo "========================================"

          grep -E \
            '^[[:space:]]*(package.name|package.domain|version|android.numeric_version)[[:space:]]*=' \
            buildozer.spec || true

      # ============================================================
      # INSTALL SYSTEM DEPENDENCIES
      # ============================================================
      - name: Install Android build dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            ant \
            autoconf \
            automake \
            autopoint \
            ccache \
            cmake \
            g++ \
            gcc \
            gettext \
            git \
            lbzip2 \
            libffi-dev \
            libltdl-dev \
            libncurses5-dev \
            libncursesw5-dev \
            libssl-dev \
            libtool \
            make \
            openjdk-17-jdk \
            patch \
            pkg-config \
            python3 \
            python3-dev \
            python3-pip \
            python3-venv \
            rsync \
            unzip \
            wget \
            zip \
            zlib1g-dev

          python3 -m pip install --upgrade pip

          python3 -m pip install \
            "cython==3.0.12" \
            "buildozer==1.5.0"

      # ============================================================
      # FORCE JAVA 17
      # ============================================================
      - name: Force Java 17
        shell: bash
        run: |
          set -euo pipefail

          JAVA17=""

          for J in \
            "/opt/hostedtoolcache/Java_Temurin-Hotspot_jdk/17"/*/x64 \
            "/usr/lib/jvm/temurin-17-jdk-amd64" \
            "/usr/lib/jvm/java-17-openjdk-amd64"
          do
            if [ -x "$J/bin/java" ]; then
              JAVA17="$J"
              break
            fi
          done

          if [ -z "$JAVA17" ]; then
            echo "ERROR: Java 17 installation was not found."
            exit 1
          fi

          echo "Using Java 17:"
          echo "$JAVA17"

          echo "JAVA_HOME=$JAVA17" >> "$GITHUB_ENV"
          echo "$JAVA17/bin" >> "$GITHUB_PATH"

          export JAVA_HOME="$JAVA17"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo
          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version

          JAVA_MAJOR="$(
            java -version 2>&1 |
            sed -n 's/.*version "\([0-9]*\).*/\1/p' |
            head -n 1
          )"

          if [ "$JAVA_MAJOR" != "17" ]; then
            echo "ERROR: Java 17 is required."
            echo "Detected Java: $JAVA_MAJOR"
            exit 1
          fi

          echo "Java 17 verification PASSED."

      # ============================================================
      # READ VERSION AUTOMATICALLY FROM BUILDOZER.SPEC
      # ============================================================
      - name: Verify installed project and fixed signing key
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          test -f buildozer.spec
          test -f requirements.txt
          test -f app/main.py
          test -f signing/debug.keystore

          PACKAGE_DOMAIN="$(
            sed -n \
              's/^[[:space:]]*package.domain[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          PACKAGE_NAME="$(
            sed -n \
              's/^[[:space:]]*package.name[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          VERSION="$(
            sed -n \
              's/^[[:space:]]*version[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          NUMERIC_VERSION="$(
            sed -n \
              's/^[[:space:]]*android.numeric_version[[:space:]]*=[[:space:]]*//p' \
              buildozer.spec |
            tail -n 1 |
            xargs
          )"

          test -n "$PACKAGE_DOMAIN"
          test -n "$PACKAGE_NAME"
          test -n "$VERSION"
          test -n "$NUMERIC_VERSION"

          PACKAGE_ID="${PACKAGE_DOMAIN}.${PACKAGE_NAME}"

          echo
          echo "========================================"
          echo "PROJECT INFORMATION"
          echo "========================================"
          echo "Package domain : $PACKAGE_DOMAIN"
          echo "Package name   : $PACKAGE_NAME"
          echo "Package ID     : $PACKAGE_ID"
          echo "Version        : $VERSION"
          echo "Version code   : $NUMERIC_VERSION"
          echo "========================================"

          # Package ID HUNDRED is constant.
          # Version and version code are NOT constant.
          test "$PACKAGE_ID" = "org.selflearningtrader.hundred"

          {
            echo "HUNDRED_PACKAGE_ID=$PACKAGE_ID"
            echo "HUNDRED_VERSION=$VERSION"
            echo "HUNDRED_VERSION_CODE=$NUMERIC_VERSION"
          } >> "$GITHUB_ENV"

          echo
          echo "Python syntax check..."

          python3 -m compileall -q app

          echo "Python syntax check PASSED."

          # ========================================================
          # INSTALL FIXED DEBUG KEY
          # ========================================================

          mkdir -p "$HOME/.android"

          cp \
            signing/debug.keystore \
            "$HOME/.android/debug.keystore"

          chmod 600 \
            "$HOME/.android/debug.keystore"

          keytool -list \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey >/dev/null

          KEY_SHA="$(
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey |
            awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          KEY_SHA="$(
            echo "$KEY_SHA" |
            tr -d '[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )"

          echo
          echo "Signing key SHA-256:"
          echo "$KEY_SHA"

          test "$KEY_SHA" = \
            "13:E0:41:41:39:05:CE:30:B0:AA:3E:40:5A:F9:7D:DE:86:2B:0C:3C:FE:DD:DB:8B:66:52:FA:28:D6:68:7F:04"

          echo "Signing key verification PASSED."

      # ============================================================
      # CLEAN BUILD
      # ============================================================
      - name: Clean Android build state
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          rm -rf \
            .buildozer \
            bin \
            signed

          find . \
            -type d \
            -name '__pycache__' \
            -prune \
            -exec rm -rf {} +

          find . \
            -type f \
            \( -name '*.pyc' -o -name '*.pyo' \) \
            -delete

      # ============================================================
      # FINAL JAVA CHECK BEFORE BUILDOZER
      # ============================================================
      - name: Verify Java before Android build
        shell: bash
        run: |
          set -euo pipefail

          echo "JAVA_HOME=$JAVA_HOME"

          which java
          which javac

          java -version
          javac -version

          JAVA_MAJOR="$(
            java -version 2>&1 |
            sed -n 's/.*version "\([0-9]*\).*/\1/p' |
            head -n 1
          )"

          test "$JAVA_MAJOR" = "17"

      # ============================================================
      # BUILD ANDROID APK
      # ============================================================
      - name: Build Android APK
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          export JAVA_HOME="$JAVA_HOME"
          export PATH="$JAVA_HOME/bin:$PATH"

          echo "========================================"
          echo "ANDROID BUILD"
          echo "========================================"

          echo "JAVA_HOME=$JAVA_HOME"

          java -version
          javac -version

          buildozer -v android debug 2>&1 | tee build.log

      # ============================================================
      # LOCATE ANDROID SIGNING TOOLS
      # ============================================================
      - name: Locate Android signing tools
        shell: bash
        run: |
          set -euo pipefail

          APKSIGNER="$(
            find "$HOME/.buildozer" \
              -type f \
              -name apksigner \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          ZIPALIGN="$(
            find "$HOME/.buildozer" \
              -type f \
              -name zipalign \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          AAPT="$(
            find "$HOME/.buildozer" \
              -type f \
              -name aapt \
              -perm -111 \
              -print 2>/dev/null |
            sort -V |
            tail -n 1
          )"

          test -n "$APKSIGNER"
          test -n "$ZIPALIGN"
          test -n "$AAPT"

          echo "APKSIGNER=$APKSIGNER" >> "$GITHUB_ENV"
          echo "ZIPALIGN=$ZIPALIGN" >> "$GITHUB_ENV"
          echo "AAPT=$AAPT" >> "$GITHUB_ENV"

          "$APKSIGNER" version
          "$ZIPALIGN" -h >/dev/null
          "$AAPT" version

      # ============================================================
      # VERIFY APK PACKAGE AND AUTOMATIC VERSION
      # ============================================================
      - name: Verify build APK package and version
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          APK="$(
            find bin \
              -type f \
              -name '*.apk' \
              -print |
            head -n 1
          )"

          test -n "$APK"

          echo "APK:"
          echo "$APK"

          BADGING="$("$AAPT" dump badging "$APK")"

          echo
          echo "APK BADGING:"
          printf '%s\n' "$BADGING" | sed -n '1,5p'

          printf '%s\n' "$BADGING" |
            grep -q \
            "package: name='$HUNDRED_PACKAGE_ID'"

          printf '%s\n' "$BADGING" |
            grep -q \
            "versionCode='$HUNDRED_VERSION_CODE'"

          printf '%s\n' "$BADGING" |
            grep -q \
            "versionName='$HUNDRED_VERSION'"

          echo
          echo "APK package/version verification PASSED."

      # ============================================================
      # ALIGN AND SIGN WITH FIXED HUNDRED KEY
      # ============================================================
      - name: Align and sign APK with fixed HUNDRED key
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          APK="$(
            find bin \
              -type f \
              -name '*.apk' \
              -print |
            head -n 1
          )"

          test -n "$APK"

          rm -rf signed
          mkdir -p signed

          "$ZIPALIGN" \
            -f \
            -p 4 \
            "$APK" \
            signed/aligned.apk

          "$APKSIGNER" sign \
            --ks "$HOME/.android/debug.keystore" \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --v1-signing-enabled true \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --v4-signing-enabled false \
            --out signed/final.apk \
            signed/aligned.apk

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            signed/final.apk

          rm -f bin/*.apk

          cp signed/final.apk bin/

      # ============================================================
      # FINAL APK VERIFICATION
      # ============================================================
      - name: Verify final APK identity alignment and certificate
        shell: bash
        run: |
          set -euo pipefail

          cd "$GITHUB_WORKSPACE"

          APK="$(
            find bin \
              -type f \
              -name '*.apk' \
              -print |
            head -n 1
          )"

          test -n "$APK"

          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          ls -lh "$APK"

          "$APKSIGNER" verify \
            --verbose \
            --print-certs \
            "$APK" |
          tee apk-cert.txt

          grep -q \
            "Verified using v1 scheme (JAR signing): true" \
            apk-cert.txt

          grep -q \
            "Verified using v2 scheme (APK Signature Scheme v2): true" \
            apk-cert.txt

          grep -q \
            "Verified using v3 scheme (APK Signature Scheme v3): true" \
            apk-cert.txt

          KEY_SHA="$(
            keytool -list -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey |
            awk -F': ' '/SHA256:/{print $2; exit}'
          )"

          APK_SHA="$(
            awk -F': ' \
              '/certificate SHA-256 digest:/{print $2; exit}' \
              apk-cert.txt
          )"

          test -n "$KEY_SHA"
          test -n "$APK_SHA"

          KEY_SHA="$(
            echo "$KEY_SHA" |
            tr -d '[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )"

          APK_SHA="$(
            echo "$APK_SHA" |
            tr -d '[:space:]' |
            tr '[:lower:]' '[:upper:]'
          )"

          echo
          echo "Keystore SHA-256:"
          echo "$KEY_SHA"

          echo
          echo "APK SHA-256:"
          echo "$APK_SHA"

          test "$KEY_SHA" = "$APK_SHA"

          "$ZIPALIGN" \
            -c \
            -P 4 \
            -v 4 \
            "$APK"

          FINAL_BADGING="$("$AAPT" dump badging "$APK")"

          echo
          echo "FINAL APK BADGING:"
          printf '%s\n' "$FINAL_BADGING" | sed -n '1,5p'

          printf '%s\n' "$FINAL_BADGING" |
            grep -q \
            "package: name='$HUNDRED_PACKAGE_ID'"

          printf '%s\n' "$FINAL_BADGING" |
            grep -q \
            "versionCode='$HUNDRED_VERSION_CODE'"

          printf '%s\n' "$FINAL_BADGING" |
            grep -q \
            "versionName='$HUNDRED_VERSION'"

          echo
          echo "========================================"
          echo "FINAL APK VERIFICATION PASSED"
          echo "========================================"

      # ============================================================
      # BUILD LOG
      # ============================================================
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-HUNDRED-build-log
          path: build.log
          if-no-files-found: warn

      # ============================================================
      # FINAL APK
      # ============================================================
      - name: Upload final verified APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: SelfLearningTrader-HUNDRED-verified-apk
          path: bin/*.apk
          if-no-files-found: error
